<div class="d-flex justify-content-center mt-4">
  <div class="col-12 col-md-6 col-lg-5 col-xl-4">
    <div class="card p-4 text-center">
      <!-- Pay Section -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="fw-bold">Send</span>
        <span class="text-muted">Available: 500</span>
      </div>
      <div class="d-flex mb-4">
        <mat-form-field appearance="outline" class="col-12">
          <mat-label>Amount</mat-label>
          <input class="custom-placeholder" matInput type="number" placeholder="0">
          <span matTextSuffix>USDC</span>
        </mat-form-field>
      </div>

      <button class="btn btn-secondary w-100 mb-4">+ Polygon</button>

      <!-- Swap Icon -->
      <div class="my-3">
        <mat-icon class="mat-icon material-icons">arrow_downward</mat-icon>
      </div>

      <!-- Receive Section -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="fw-bold">Receive (Estimated)</span>
        <span class="text-muted">Available: 1,200</span>
      </div>
      <div class="d-flex mb-4">
        <mat-form-field appearance="fill" class="col-4">
          <mat-label>Currency</mat-label>
          <mat-select>
            <mat-option value="USDC">USDC</mat-option>
            <mat-option value="BUSD">BUSD</mat-option>
            <mat-option value="USDT">USDT</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="fill" class="col-8">
          <mat-label>Amount</mat-label>
          <input matInput type="number" placeholder="0">
        </mat-form-field>
      </div>

      <!-- Exchange Rate -->
      <div class="text-muted mb-4">1 BUSD = 1.0005 USDC <button class="btn btn-link p-0"><mat-icon class="mat-icon material-icons">refresh</mat-icon></button></div>

      <!-- Confirm Order Button -->
      <button class="btn btn-primary w-100 mb-4">Confirm Order</button>

      <!-- Trading Info -->
      <div class="d-flex justify-content-between">
        <span class="text-muted">Trade Minting <mat-icon class="mat-icon material-icons">help_outline</mat-icon></span>
        <span class="fw-bold">Max Reward 5.04 DEX $16.68</span>
      </div>
    </div>
  </div>
</div>
