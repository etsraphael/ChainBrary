<div class="d-flex justify-content-center mt-4">
  <div class="col-12 col-md-6 col-lg-5 col-xl-4">
    <div class="card cb-card border-0 shadow-sm p-4 text-center">
      <form [formGroup]="swapForm">
        <!-- Pay Section -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="d-flex align-items-center">
            <h6 class="mb-0 text-muted">From</h6>
            <button class="btn btn-network w-100 mx-2" (click)="openNetowkDialog(true)">
              {{ networkPath[0].name }}
            </button>
          </div>
        </div>
        <div class="d-flex mb-4">
          <mat-form-field appearance="outline" class="col-12">
            <mat-label>Amount</mat-label>
            <input class="px-2" matInput type="number" placeholder="0" formControlName="fromAmount" />
            <span (click)="openTokensDialog(true)" class="currency-container-input px-2" matTextSuffix>
              {{ tokenPath[0].symbol }}
              <i class="bi bi-chevron-down"></i>
            </span>
            <mat-hint *ngIf="token1Available$ | async; let t">
              <span class="text-muted">Available: {{ t.balance }}</span>
            </mat-hint>
          </mat-form-field>
        </div>
        <!-- Swap Icon -->
        <div>
          <mat-icon class="mat-icon material-icons">arrow_downward</mat-icon>
        </div>
        <!-- Receive Section -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="d-flex align-items-center">
            <h6 class="mb-0 text-muted">To</h6>
            <button class="btn btn-network w-100 mx-2" (click)="openNetowkDialog(false)">
              {{ networkPath[1].name }}
            </button>
          </div>
        </div>
        <div class="d-flex mb-4">
          <mat-form-field appearance="outline" class="col-12">
            <mat-label>Amount</mat-label>
            <input class="px-2" matInput type="number" placeholder="0" />
            <span (click)="openTokensDialog(false)" class="currency-container-input px-2" matTextSuffix>
              {{ tokenPath[1].symbol }}
              <i class="bi bi-chevron-down"></i>
            </span>
          </mat-form-field>
        </div>
        <!-- Exchange Rate -->
        <div class="text-muted mb-4">
          {{ tokenQuoteText$ | async }}
          <button (click)="loadQuote()" class="btn btn-link p-0">
            <mat-icon class="mat-icon material-icons">refresh</mat-icon>
          </button>
        </div>

        <!-- Approval Buttons -->
        <ng-container>
          <button class="btn btn-primary w-100 mb-2" type="submit" (click)="approveToken(true)">
            Approve {{ tokenPath[0].symbol }}
          </button>
          <!-- <button
                    *ngIf="allowance2Needed$ | async"
                    class="btn btn-primary w-100 mb-4"
                    type="submit"
                    (click)="approveToken(false)"
                  >
                    Approve {{ tokenPath[1].symbol }}
                  </button> -->
        </ng-container>

        <!-- Confirm Order Button -->
        <button (click)="sendSwapRequest()" class="btn btn-primary w-100 mb-4" type="submit">Confirm Order</button>
      </form>
    </div>
  </div>
</div>
